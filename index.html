<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Default Predictor - Feature List</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(820px 460px at 100% -6%, rgba(167,139,250,.10), transparent 60%),
        radial-gradient(680px 380px at 0% 102%, rgba(45,212,191,.07), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Left navigation rail */
    .sidebar {
      width: 232px; flex-shrink: 0; background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 1.4rem;
      padding: 1.5rem 0; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: .65rem; padding: 0 1.3rem; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, #58a6ff 0%, #a78bfa 55%, #f472b6 100%);
      box-shadow: 0 4px 14px rgba(88,166,255,.3);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-text h1 { font-size: 1.02rem; margin: 0; line-height: 1.15; letter-spacing: -.01em; }
    .brand-text .sub { color: var(--muted); margin: 0; font-size: .72rem; }
    .nav { display: flex; flex-direction: column; gap: .14rem; padding: 0 .7rem; }
    .nav-label {
      color: var(--muted); font-size: .67rem; letter-spacing: .09em;
      text-transform: uppercase; padding: 0 .85rem .3rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: .65rem; width: 100%; text-align: left;
      background: transparent; color: var(--muted); border: none; border-radius: 9px;
      padding: .56rem .8rem; font-size: .92rem; cursor: pointer; transition: background .12s, color .12s;
    }
    .nav-ico { display: grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--c); opacity: .85; }
    .nav-ico svg { width: 19px; height: 19px; }
    .nav-item:hover { background: #1c2128; color: var(--text); }
    .nav-item:hover .nav-ico { opacity: 1; }
    .nav-item.active {
      background: #1c2128;
      background: color-mix(in srgb, var(--c) 15%, transparent);
      color: var(--text); box-shadow: inset 3px 0 0 var(--c); font-weight: 600;
    }
    .nav-item.active .nav-ico { opacity: 1; }
    /* Main content column */
    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .view-head {
      max-width: 1600px; margin: 0 auto; width: 100%; flex-shrink: 0;
      padding: 1.3rem 2.5rem .7rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .view-ico {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      display: grid; place-items: center; color: var(--va, var(--accent));
      background: #182230;
      background: color-mix(in srgb, var(--va, var(--accent)) 16%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--va, var(--accent)) 30%, transparent);
    }
    .view-ico svg { width: 25px; height: 25px; }
    .view-title { font-size: 1.6rem; margin: 0 0 .15rem; letter-spacing: -.015em; }
    .view-sub { color: var(--muted); margin: 0; font-size: .9rem; }
    .wrap {
      max-width: 1600px; margin: 0 auto; width: 100%; padding: .4rem 2.5rem 1.25rem;
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .wrap > section:not([hidden]) { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    @media (max-width: 760px) {
      body { flex-direction: column; }
      .sidebar {
        width: auto; height: auto; position: static; flex-direction: row;
        flex-wrap: wrap; align-items: center; gap: .4rem .9rem; padding: 1rem 1.25rem;
      }
      .nav { flex-direction: row; flex-wrap: wrap; padding: 0; gap: .3rem; }
      .nav-label { display: none; }
      .view-head, .wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
    .stats { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.25rem 0; }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem .9rem; font-size: .85rem;
    }
    .stat b { font-size: 1.1rem; display: block; }
    .controls {
      display: flex; flex-wrap: wrap; gap: .6rem;
      flex-shrink: 0; padding: .2rem 0 .8rem;
    }
    input, select {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: .5rem .7rem; font-size: .9rem;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88,166,255,.16);
    }
    .search { flex: 1 1 260px; min-width: 220px; }
    .count { color: var(--muted); font-size: .85rem; margin: 0 0 .5rem; flex-shrink: 0; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td {
      text-align: left; padding: .55rem .7rem;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th {
      position: sticky; top: var(--ch, 0); z-index: 3; background: var(--panel);
      cursor: pointer; user-select: none; white-space: nowrap;
      box-shadow: inset 0 -1px 0 var(--border);
    }
    th:hover { color: var(--accent); }
    tbody tr:hover { background: #1c2128; }
    code { color: var(--accent); font-family: ui-monospace, monospace; }
    .badge {
      display: inline-block; padding: .12rem .5rem; border-radius: 999px;
      font-size: .72rem; font-weight: 600; white-space: nowrap;
    }
    .av-now      { background: #1b3a2b; color: #4ade80; }
    .av-bulk     { background: #3a341b; color: #fbbf24; }
    .av-scrape   { background: #1b2f3a; color: #60a5fa; }
    .av-vendor   { background: #3a1b34; color: #f472b6; }
    .av-excluded { background: #3a1b1b; color: #f87171; }
    .role { color: var(--muted); font-size: .78rem; }
    .yes { color: #4ade80; }
    .muted { color: var(--muted); }
    td a { color: var(--accent); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    #count { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    .err { color: #f87171; padding: 1rem; }
    .tablewrap {
      overflow: auto; flex: 1; min-height: 0; position: relative;
      border: 1px solid var(--border); border-radius: 8px;
    }
    #prop-table td.num, #prop-table th.num { text-align: right; white-space: nowrap; }
    #up-table td.num, #up-table th.num { text-align: right; white-space: nowrap; }
    #up-table code { font-size: .78rem; }
    #up-count { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    .st-complete { background: #1b3a2b; color: #4ade80; }
    .st-partial  { background: #3a341b; color: #fbbf24; }
    .st-failed   { background: #3a1b1b; color: #f87171; }
    #up-table tbody tr { cursor: pointer; }
    .modal-bk {
      position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-bk[hidden] { display: none; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      max-width: 96vw; max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 0 12px 48px rgba(0,0,0,.6);
    }
    .modal-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      padding: .9rem 1.1rem; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-weight: 600; }
    .modal-title code { font-size: .85rem; }
    .modal-meta { color: var(--muted); font-size: .8rem; margin-top: .3rem; }
    .modal-close {
      background: none; border: none; color: var(--muted); font-size: 1.5rem;
      line-height: 1; cursor: pointer; padding: 0 .2rem;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { overflow: auto; }
    #preview-table { font-size: .8rem; white-space: nowrap; }
    #preview-table th { position: sticky; top: 0; background: var(--panel); }
    #preview-table td { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    .modal-search { padding: .6rem 1.1rem; border-bottom: 1px solid var(--border); }
    .modal-search input { width: 100%; }
    #preview-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; padding: .5rem 1.1rem; border-top: 1px solid var(--border);
    }
    #preview-note { color: var(--muted); font-size: .8rem; }
    #preview-pager { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; margin: 0; }
    #preview-pager button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: .3rem .55rem; font-size: .82rem; cursor: pointer; min-width: 1.9rem;
    }
    #preview-pager button:hover:not(:disabled):not(.active) { border-color: var(--accent); color: var(--accent); }
    #preview-pager button.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; cursor: default; }
    #preview-pager button:disabled { opacity: .4; cursor: default; }
    #preview-pager .ell { color: var(--muted); padding: 0 .15rem; }
    #prop-table td.addr { white-space: nowrap; }
    .neg { color: #f87171; }
    .pos { color: #4ade80; }
    .flag-absentee { background: #3a341b; color: #fbbf24; }
    .flag-oos { background: #3a1b1b; color: #f87171; }
    .flag-entity { background: #3a1b34; color: #f472b6; }
    #prop-count { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    th.jump:hover { color: var(--accent); text-decoration: underline; }
    .def-popup {
      position: absolute; z-index: 50; max-width: 320px;
      background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
      padding: .7rem .85rem; box-shadow: 0 6px 24px rgba(0,0,0,.5); font-size: .85rem;
    }
    .def-popup[hidden] { display: none; }
    .def-name { font-weight: 600; margin-bottom: .3rem; }
    .def-desc { line-height: 1.45; }
    .def-src { color: var(--muted); font-size: .78rem; margin-top: .4rem; }
    .def-src a { color: var(--accent); }
    .why-btn {
      display: inline-block; width: 1.35rem; height: 1.35rem; line-height: 1.35rem;
      text-align: center; border-radius: 50%; background: var(--accent); color: #0d1117;
      font-weight: 700; cursor: pointer; user-select: none;
    }
    .why-btn:hover { filter: brightness(1.2); }
    .pager { display: flex; align-items: center; gap: .8rem; margin: .7rem 0 0; flex-shrink: 0; }
    .pager button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: .45rem .9rem; font-size: .88rem; cursor: pointer;
    }
    .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pager button:disabled { opacity: .4; cursor: default; }
    /* Schedule view */
    .sched-summary { color: var(--muted); font-size: .9rem; margin: .1rem 0 .9rem; flex-shrink: 0; }
    .sched-grid { display: flex; flex-direction: column; gap: .5rem; flex: 1; min-height: 0; overflow: auto; padding: 0 .25rem .7rem; }
    .sched-row {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 3px solid var(--cc, var(--accent)); border-radius: 10px; overflow: hidden;
    }
    .sched-row-head { display: flex; align-items: center; gap: .65rem; padding: .7rem 1rem; cursor: pointer; }
    .sched-row-head:hover { background: #1c2128; }
    .sched-pill {
      font-size: .64rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, transparent);
      border-radius: 999px; padding: .13rem .55rem; flex-shrink: 0;
    }
    .sched-spacer { flex: 1; }
    .sched-rico { display: grid; place-items: center; width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; }
    .sched-rico svg { width: 17px; height: 17px; }
    .sched-rico.active { color: #4ade80; }
    .sched-rico.error { color: #f87171; }
    .sched-rico.inactive { color: var(--muted); opacity: .5; }
    .sched-row.off { opacity: .6; }
    .sched-name { font-weight: 600; font-size: .92rem; }
    .sched-next-mini { color: var(--muted); font-size: .77rem; white-space: nowrap; display: inline-flex; align-items: center; gap: .3rem; }
    .sched-next-mini .m-ico { color: var(--muted); }
    .m-ico { display: inline-grid; place-items: center; color: var(--cc); }
    .m-ico svg { width: 12px; height: 12px; }
    .sched-chev { color: var(--muted); font-size: 1.2rem; line-height: 1; transition: transform .15s; flex-shrink: 0; }
    .sched-row.open .sched-chev { transform: rotate(90deg); }
    .sched-detail { display: none; padding: .95rem 1.1rem 1.1rem; border-top: 1px solid var(--border); background: rgba(255,255,255,.02); }
    .sched-row.open .sched-detail { display: block; }
    .d-what { font-size: .9rem; margin: 0 0 .35rem; }
    .d-why { color: var(--muted); font-size: .83rem; margin: 0; }
    .d-note {
      color: #fbd34d; font-size: .8rem; margin-top: .65rem; padding: .5rem .7rem; border-radius: 8px;
      background: color-mix(in srgb, #fbbf24 10%, transparent);
      border: 1px solid color-mix(in srgb, #fbbf24 28%, transparent);
    }
    .sched-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .55rem; margin-top: .9rem; }
    .m-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .65rem; }
    .m-lbl { color: var(--muted); font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .22rem; display: flex; align-items: center; gap: .3rem; }
    .m-val { font-size: .86rem; }
    .m-val.accent { color: var(--cc); font-weight: 600; }
    .m-val.mono { font-family: ui-monospace, monospace; font-size: .79rem; }
    .m-val a { color: var(--cc); text-decoration: none; word-break: break-all; }
    .m-val a:hover { text-decoration: underline; }
    /* Scheduler table: size to content (last row = bottom) until it fills the space, then scroll */
    #tab-schedule .tablewrap { flex: 0 1 auto; }
    #sched-table td.st, #sched-table th.st { width: 1%; white-space: nowrap; text-align: center; }
    #sched-table .sname { font-weight: 600; }
    #sched-table .mono2 { font-variant-numeric: tabular-nums; }
    #sched-table td.nowrap { white-space: nowrap; }
    #sched-table tbody tr { cursor: pointer; }
    #sched-table tbody tr.off { opacity: .55; }
    #sched-table .sched-rico { width: 18px; height: 18px; margin: 0 auto; }
    #sched-table .sched-rico svg { width: 16px; height: 16px; }
    .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: .2rem; display: inline-grid; place-items: center; border-radius: 6px; }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { color: var(--accent); background: #1c2128; }
    /* Scheduler detail/edit modal */
    .sched-modal { width: 520px; max-width: 96vw; }
    .sm-body { padding: 1.05rem 1.25rem; }
    .sm-what { font-size: .95rem; margin-bottom: .35rem; }
    .sm-why { color: var(--muted); font-size: .85rem; }
    .sm-cont { color: var(--muted); font-size: .88rem; padding: .8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-top: .6rem; }
    .sm-edit { display: flex; flex-direction: column; gap: .85rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .sm-field { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .sm-field > label:first-child { color: var(--muted); font-size: .85rem; }
    .sm-field select, .sm-field input[type=time] { min-width: 170px; }
    .toggle { display: inline-flex; align-items: center; gap: .55rem; cursor: pointer; position: relative; }
    .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle .track { width: 38px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background .15s; flex-shrink: 0; }
    .toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .toggle input:checked + .track { background: #4ade80; }
    .toggle input:checked + .track::after { transform: translateX(16px); }
    .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 1rem; padding: .8rem 1.25rem; border-top: 1px solid var(--border); }
    #sm-msg { color: var(--muted); font-size: .83rem; margin-right: auto; }
    #sm-msg.bad { color: #f87171; }
    #sm-msg.ok2 { color: #4ade80; }
    .btn-primary { background: var(--accent); color: #0d1117; border: none; border-radius: 7px; padding: .5rem 1.1rem; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { filter: brightness(1.1); }
    .sched-card {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 3px solid var(--cc, var(--accent)); border-radius: 12px; overflow: hidden;
    }
    .sched-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: .75rem; padding: .9rem 1.1rem; border-bottom: 1px solid var(--border);
    }
    .sched-cad { display: flex; align-items: center; gap: .55rem; }
    .sched-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); box-shadow: 0 0 9px var(--cc); flex-shrink: 0; }
    .sched-cad b { font-size: 1rem; }
    .sched-freq { color: var(--muted); font-size: .8rem; margin-top: .1rem; }
    .sched-next { text-align: right; font-size: .82rem; line-height: 1.3; white-space: nowrap; }
    .sched-next .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: .62rem; }
    .sched-next b { display: block; color: var(--cc); font-size: .86rem; }
    .cap { padding: .75rem 1.1rem; border-top: 1px solid rgba(255,255,255,.05); }
    .cap-top { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
    .cap-ds { font-weight: 600; font-size: .92rem; }
    .cap-src { color: var(--muted); font-size: .76rem; }
    .cap-last { margin-left: auto; font-size: .72rem; color: var(--muted); white-space: nowrap; }
    .cap-last .ok { color: #4ade80; }
    .cap-what { font-size: .83rem; margin-top: .25rem; }
    .cap-why { color: var(--muted); font-size: .78rem; margin-top: .2rem; }
    .cap-note { color: #fbbf24; font-size: .74rem; margin-top: .35rem; }
    .sched-tag {
      font-size: .64rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .1rem .5rem;
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark"></div>
      <div class="brand-text">
        <h1>Default Predictor</h1>
        <p class="sub">Multnomah County, OR</p>
      </div>
    </div>
    <div class="nav">
      <div class="nav-label">Views</div>
      <button class="nav-item" data-tab="uploads" style="--c:#58a6ff"><span class="nav-ico" data-ico="uploads"></span><span>Uploads</span></button>
      <button class="nav-item" data-tab="schedule" style="--c:#34d399"><span class="nav-ico" data-ico="schedule"></span><span>Schedule</span></button>
      <button class="nav-item active" data-tab="features" style="--c:#a78bfa"><span class="nav-ico" data-ico="features"></span><span>Features</span></button>
      <button class="nav-item" data-tab="properties" style="--c:#2dd4bf"><span class="nav-ico" data-ico="properties"></span><span>Properties</span></button>
      <button class="nav-item" data-tab="defaults" style="--c:#fb923c"><span class="nav-ico" data-ico="defaults"></span><span>Defaults</span></button>
    </div>
  </nav>
  <main class="main">
    <div class="view-head" id="view-head">
      <div class="view-ico" id="view-ico"></div>
      <div>
        <h2 class="view-title" id="view-title">Feature List</h2>
        <p class="view-sub" id="view-sub"></p>
      </div>
    </div>
    <div class="wrap">
    <section id="tab-schedule" hidden>
      <div class="count sched-summary" id="sched-summary"></div>
      <div class="controls">
        <input class="search" id="sched-search" type="text" placeholder="Search schedulers by name, source, frequency…">
        <select id="sched-fsrc"><option value="">All sources</option></select>
        <select id="sched-ffreq">
          <option value="">All frequencies</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="continuous">Continuous</option>
        </select>
      </div>
      <div class="tablewrap">
        <table id="sched-table">
          <thead><tr>
            <th class="st"></th><th>Scheduler</th><th>Source</th><th>Frequency</th>
            <th>Day</th><th>Time&nbsp;(PT)</th><th>Next run</th><th>Last</th><th class="st"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="sched-error" class="err"></div>

  <script>
    // Minimal RFC-4180-ish CSV parser (handles quoted fields & embedded commas).
    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        } else field += c;
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      const header = rows.shift();
      return rows.map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ''])));
    }

    // Map a source name (or one segment of a combined source) to its site.
    // First matching pattern wins. Sources with no single site (skip-trace
    // vendors, "n/a", credit bureau) stay as plain text.
    const SOURCE_LINKS = [
      [/portland maps/i, 'https://www.portlandmaps.com'],
      [/multnomah county/i, 'https://www.multco.us/dart'],
      [/public notices oregon/i, 'https://www.publicnoticeoregon.com'],
      [/oregon judicial/i, 'https://www.courts.oregon.gov'],
      [/oregon secretary of state/i, 'https://sos.oregon.gov/business/Pages/find.aspx'],
      [/pacer/i, 'https://pacer.uscourts.gov'],
      [/courtlistener/i, 'https://www.courtlistener.com'],
      [/census/i, 'https://www.census.gov'],
      [/\bhud\b/i, 'https://www.huduser.gov'],
      [/water bureau/i, 'https://www.portland.gov/water'],
      [/city of portland/i, 'https://www.portland.gov'],
      [/\bpge\b/i, 'https://portlandgeneral.com'],
      [/pacific power/i, 'https://www.pacificpower.net'],
      [/obituar/i, 'https://www.legacy.com'],
    ];
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    function sourceUrl(seg) {
      for (const [re, url] of SOURCE_LINKS) if (re.test(seg)) return url;
      return null;
    }
    function linkifySource(source) {
      // Split only on " / " (spaces both sides) so inner slashes like
      // "(Census/Metro)" or "(OECI/OJCIN)" stay intact.
      return source.split(/\s+\/\s+/).map(seg => {
        const u = sourceUrl(seg);
        return u ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${esc(seg)}</a>` : esc(seg);
      }).join(' / ');
    }

    // Display a snake_case feature_name as a readable label, matching the
    // Property table column style (e.g. building_sqft -> "Building sqft").
    const ACRONYMS = { id: 'ID', zip: 'ZIP', yoy: 'YoY', fema: 'FEMA', irs: 'IRS', pge: 'PGE' };
    function prettyName(name) {
      const s = name.replace(/_flag$/, '').replace(/_pct$/, '').replace(/_/g, ' ').trim();
      return s.split(' ').map((w, i) => {
        const lw = w.toLowerCase();
        if (ACRONYMS[lw]) return ACRONYMS[lw];
        return i === 0 ? lw.charAt(0).toUpperCase() + lw.slice(1) : lw;
      }).join(' ');
    }

    let DATA = [], sortKey = 'source', sortAsc = true;

    function uniq(key) { return [...new Set(DATA.map(d => d[key]).filter(Boolean))].sort(); }
    function fill(sel, vals) {
      document.getElementById(sel).insertAdjacentHTML('beforeend',
        vals.map(v => `<option value="${v}">${v}</option>`).join(''));
    }

    // Shared client-side owner/property filter (Defaults + static fallback).
    function matchProp(p, q, occ, otype, ostate) {
      if (q) {
        const hay = [p.owner, p.address, p.property_id, p.owner_city].join(' ').toLowerCase();
        if (!hay.includes(q.toLowerCase())) return false;
      }
      if (occ === 'owner' && p.occupancy !== 'Owner-occupied') return false;
      if (occ === 'absentee' && p.occupancy !== 'Absentee') return false;
      if (otype === 'entity' && p.owner_type !== 'Entity') return false;
      if (otype === 'individual' && p.owner_type !== 'Individual') return false;
      if (ostate === 'or' && p.owner_state !== 'OR') return false;
      if (ostate === 'oos' && (!p.owner_state || p.owner_state === 'OR')) return false;
      return true;
    }
    function debounce(fn, ms) {
      let t = null;
      return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }

    const check = '<span class="yes">✓</span>';
    const dash = '<span class="muted">—</span>';

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const fc = document.getElementById('filter-category').value;
      const fs = document.getElementById('filter-source').value;
      const fu = document.getElementById('filter-used').value;
      let rows = DATA.filter(d =>
        (!fc || d.category === fc) &&
        (!fs || d.source === fs) &&
        (!fu || d.used === fu) &&
        (!q || [d.feature_name, d.description, d.source].join(' ').toLowerCase().includes(q)));
      if (sortKey) {
        rows = [...rows].sort((a, b) => {
          const x = (a[sortKey] || '').toLowerCase(), y = (b[sortKey] || '').toLowerCase();
          return (x < y ? -1 : x > y ? 1 : 0) * (sortAsc ? 1 : -1);
        });
      }
      document.getElementById('count').textContent = `${rows.length} of ${DATA.length} features`;
      document.getElementById('rows').innerHTML = rows.map(d => `
        <tr data-feature="${d.feature_name}">
          <td title="${d.feature_name}">${prettyName(d.feature_name)}</td>
          <td>${d.category}</td>
          <td>${d.description}</td>
          <td class="muted">${linkifySource(d.source)}</td>
          <td>${d.derived === 'Y' ? check : dash}</td>
          <td>${d.used === 'Y' ? check : dash}</td>
        </tr>`).join('');
    }

    document.querySelectorAll('th[data-key]').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
      render();
    }));
    ['search', 'filter-category', 'filter-source', 'filter-used']
      .forEach(id => document.getElementById(id).addEventListener('input', render));

    fetch('features.csv')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(text => {
        DATA = parseCSV(text);
        fill('filter-category', uniq('category'));
        fill('filter-source', uniq('source'));
        render();
      })
      .catch(e => {
        document.getElementById('error').innerHTML = `<p class="err">Could not load features.csv (${e.message}). Make sure it sits next to index.html.</p>`;
      });

    /* ---- Properties tab ---- */
    let PROPS = null;
    const fmtMoney = v => v == null ? '—' : '$' + v.toLocaleString();
    const fmtNum = v => (v == null || v === '') ? '—' : v;
    const fmtCount = v => v == null ? '—' : v.toLocaleString();
    const fmtPct = v => v == null ? '—' : v + '%';
    const fmtMult = v => v == null ? '—' : v + '×';
    const fmtEnforce = v => !v ? '<span class="muted">0</span>' : `<span class="badge flag-oos">${v}</span>`;
    const fmtDeed = v => !v ? '<span class="muted">—</span>'
      : /probate|foreclosure|trustee|sheriff|heir/i.test(v) ? `<span class="badge flag-absentee">${esc(v)}</span>` : `<span class="muted">${esc(v)}</span>`;
    const fmtRisk = v => v === 'Yes' ? '<span class="badge flag-oos">Yes</span>' : '<span class="muted">No</span>';
    const fmtFlagY = v => v === 'Yes' ? '<span class="badge flag-absentee">Yes</span>' : '<span class="muted">No</span>';
    const fmtHazard = v => !v ? '<span class="muted">0</span>' : `<span class="badge flag-oos">${v}</span>`;
    const fmtLiq = v => !v ? '—' : /high/i.test(v) ? `<span class="badge flag-oos">${esc(v)}</span>` : `<span class="muted">${esc(v)}</span>`;
    function fmtTrend(v) {
      if (v == null) return '—';
      const cls = v < 0 ? 'neg' : v > 0 ? 'pos' : '';
      return `<span class="${cls}">${v > 0 ? '+' : ''}${v}%</span>`;
    }
    const fmtOccupancy = v => v === 'Absentee'
      ? '<span class="badge flag-absentee">Absentee</span>'
      : '<span class="muted">Owner-occupied</span>';
    const fmtOwnerType = v => v === 'Entity'
      ? '<span class="badge flag-entity">Entity</span>'
      : '<span class="muted">Individual</span>';
    const fmtState = v => (v && v !== 'OR')
      ? `<span class="badge flag-oos">${esc(v)}</span>`
      : `<span class="muted">${esc(v || '—')}</span>`;

    const PROP_COLS = [
      ['Scraped', 'scraped_date', 'addr', v => esc(v || '—')],
      ['Property ID', 'property_id', 'addr', v => esc(v || '')],
      ['Alt account', 'alt_account', 'addr', v => esc(v || '—')],
      ['Address', 'address', 'addr', v => esc(v || '')],
      ['Owner', 'owner', '', v => esc(v || '')],
      ['Owners', 'owner_count', 'num', fmtNum],
      ['Owner city', 'owner_city', '', v => esc(v || '')],
      ['Owner state', 'owner_state', '', fmtState],
      ['Owner ZIP', 'owner_zip', 'num', fmtNum],
      ['Occupancy', 'occupancy', '', fmtOccupancy],
      ['Owner type', 'owner_type', '', fmtOwnerType],
      ['Reg. rental', 'rental_regulated', '', fmtFlagY],
      ['Neighborhood', 'neighborhood', '', v => esc(v || '—')],
      ['Council', 'council_district', 'num', fmtNum],
      ['School district', 'school_district', '', v => esc(v || '—')],
      ['Elementary', 'elementary_school', '', v => esc(v || '—')],
      ['Nearest park', 'nearest_park', '', v => esc(v || '—')],
      ['Latitude', 'latitude', 'num', fmtNum],
      ['Longitude', 'longitude', 'num', fmtNum],
      ['Elev (ft)', 'elevation_ft', 'num', fmtNum],
      ['Year built', 'year_built', 'num', fmtNum],
      ['Age', 'age', 'num', fmtNum],
      ['Bldg sqft', 'sqft', 'num', fmtCount],
      ['Baths', 'bathrooms', 'num', fmtNum],
      ['Units', 'units', 'num', fmtNum],
      ['Improvements', 'improvements', 'num', fmtNum],
      ['Lot sqft', 'lot_sqft', 'num', fmtCount],
      ['Land use', 'land_use', '', v => esc(v || '—')],
      ['Site ZIP', 'site_zip', 'num', fmtNum],
      ['Zoning', 'zoning', '', v => esc(v || '—')],
      ['Commercial zone', 'commercial_zone', '', fmtFlagY],
      ['Urban svc', 'urban_service', '', v => esc(v || '—')],
      ['Flood zone', 'flood_zone', '', fmtRisk],
      ['Landslide', 'landslide', '', fmtRisk],
      ['Steep slope', 'steep_slope', '', fmtRisk],
      ['Liquefaction', 'liquefaction', '', fmtLiq],
      ['Hazards', 'hazard_count', 'num', fmtHazard],
      ['Crime (area)', 'crime_area', 'num', fmtCount],
      ['Fire dist (ft)', 'fire_dist_ft', 'num', fmtCount],
      ['Tract income', 'tract_median_income', 'num', fmtMoney],
      ['Tract poverty', 'tract_poverty_pct', 'num', fmtPct],
      ['Tract ownership', 'tract_homeownership_pct', 'num', fmtPct],
      ['Tract vacancy', 'tract_vacancy_pct', 'num', fmtPct],
      ['Tract home val', 'tract_median_home_value', 'num', fmtMoney],
      ['Land val (’23)', 'land_value', 'num', fmtMoney],
      ['Bldg val (’23)', 'building_value', 'num', fmtMoney],
      ['Land share', 'land_share_pct', 'num', fmtPct],
      ['Assessed (’24)', 'assessed_value_mid', 'num', fmtMoney],
      ['Assessed', 'assessed_value', 'num', fmtMoney],
      ['$/sqft', 'price_per_sqft', 'num', fmtMoney],
      ['$/lot sqft', 'value_per_lot_sqft', 'num', fmtMoney],
      ['Value trend', 'value_trend_pct', 'num', fmtTrend],
      ['Permits', 'permit_count', 'num', fmtNum],
      ['Last permit', 'last_permit_year', 'num', fmtNum],
      ['Yrs since permit', 'years_since_permit', 'num', fmtNum],
      ['Code violations', 'enforcement_count', 'num', fmtEnforce],
      ['Vacant/derelict', 'violation_vacant', 'num', fmtEnforce],
      ['Overgrowth', 'violation_overgrowth', 'num', fmtEnforce],
      ['Trash/debris', 'violation_trash', 'num', fmtEnforce],
      ['Vehicle', 'violation_vehicle', 'num', fmtEnforce],
      ['Zoning viol.', 'violation_zoning', 'num', fmtEnforce],
      ['Noise', 'violation_noise', 'num', fmtEnforce],
      ['Other viol.', 'violation_other', 'num', fmtEnforce],
      ['Demolition', 'demolition', '', fmtRisk],
      ['Historic', 'historic_district', '', v => esc(v || '—')],
      ['Related accts', 'related_accounts', 'num', fmtNum],
      ['Acct status', 'account_status', '', v => esc(v || '—')],
      ['Tax code', 'tax_code', '', v => esc(v || '—')],
      ['Annual tax', 'annual_tax_amount', 'num', fmtMoney],
      ['Last sale', 'last_sale_date', 'num', fmtNum],
      ['Tenure (yrs)', 'tenure_years', 'num', fmtNum],
      ['Sale price', 'last_sale_price', 'num', fmtMoney],
      ['Apprec.', 'appreciation', 'num', fmtMult],
      ['Deed type', 'deed_type', '', fmtDeed],
      ['Deed date', 'deed_date', 'num', fmtNum],
      ['Instrument #', 'instrument_num', 'addr', v => esc(v || '—')],
      ['Exemption', 'exemption', 'num', v => esc(v || '—')],
      ['Probate', 'probate_flag', '', fmtRisk],
      ['Bankruptcy', 'bankruptcy_flag', '', fmtRisk],
      ['BK recent', 'bankruptcy_recent', '', fmtRisk],
      ['BK chapter', 'bankruptcy_chapter', '', v => esc(v || '—')],
      ['BK filed', 'bankruptcy_date', 'num', v => esc(v || '—')],
    ];

    // Each Properties column maps to a feature in the dictionary; clicking the
    // header jumps to that feature on the Features tab. Most keys match the
    // feature name directly; these are the exceptions.
    const COL_FEATURE = {
      address: 'site_address', owner: 'owner_name', owner_city: 'owner_mailing_address',
      owner_state: 'out_of_state_owner_flag', owner_zip: 'owner_mailing_address',
      occupancy: 'owner_occupied_flag', owner_type: 'owner_is_entity_flag', age: 'property_age',
      sqft: 'building_sqft', lot_sqft: 'lot_size_sqft', site_zip: 'site_address', zoning: 'zoning_code',
      landslide: 'landslide_hazard', liquefaction: 'liquefaction_hazard', assessed_value: 'total_assessed_value',
      value_trend_pct: 'assessed_value_trend_pct', permit_count: 'recent_permit_count',
      enforcement_count: 'code_violation_count', appreciation: 'appreciation_since_purchase',
      demolition: 'demolition_permit_flag',
    };
    const colFeature = key => COL_FEATURE[key] || key;

    let defPopup = null;
    function showDefinition(name, anchor) {
      if (!defPopup) {
        defPopup = document.createElement('div');
        defPopup.className = 'def-popup';
        defPopup.hidden = true;
        document.body.appendChild(defPopup);
        document.addEventListener('click', e => {
          if (!defPopup.contains(e.target) && !e.target.closest('th.jump')) defPopup.hidden = true;
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') defPopup.hidden = true; });
      }
      const feat = DATA.find(d => d.feature_name === name);
      if (!feat) { defPopup.hidden = true; return; }
      defPopup.innerHTML =
        `<div class="def-name">${prettyName(feat.feature_name)}</div>` +
        `<div class="def-desc">${esc(feat.description)}</div>` +
        `<div class="def-src">Source: ${linkifySource(feat.source)}</div>`;
      defPopup.hidden = false;
      const r = anchor.getBoundingClientRect();
      const maxLeft = document.documentElement.clientWidth - defPopup.offsetWidth - 10;
      defPopup.style.top = (r.bottom + window.scrollY + 6) + 'px';
      defPopup.style.left = Math.min(r.left + window.scrollX, maxLeft + window.scrollX) + 'px';
    }

    let PROP_PAGE = 1, PROP_PAGES = 1, PROP_TOTAL = 0, PROP_GRAND = 0, STATIC = null;
    let PROP_Q = '', PROP_OCC = '', PROP_OTYPE = '', PROP_OSTATE = '';

    function renderProperties() {
      document.querySelector('#prop-table thead').innerHTML =
        '<tr>' + PROP_COLS.map(c => `<th class="${c[2]} jump" data-feature="${colFeature(c[1])}">${c[0]}</th>`).join('') + '</tr>';
      document.querySelectorAll('#prop-table th.jump').forEach(th =>
        th.addEventListener('click', () => showDefinition(th.dataset.feature, th)));
      document.querySelector('#prop-table tbody').innerHTML = PROPS.map(p =>
        '<tr>' + PROP_COLS.map(c => `<td class="${c[2]}">${c[3](p[c[1]])}</td>`).join('') + '</tr>').join('');
      const pf = PROP_Q || PROP_OCC || PROP_OTYPE || PROP_OSTATE;
      document.getElementById('prop-count').textContent = pf
        ? `${PROP_TOTAL.toLocaleString()} of ${PROP_GRAND.toLocaleString()} properties`
        : `${PROP_GRAND.toLocaleString()} properties`;
      document.getElementById('prop-pageinfo').textContent =
        `Page ${PROP_PAGE.toLocaleString()} of ${PROP_PAGES.toLocaleString()}`;
      document.getElementById('prop-pager').hidden = PROP_PAGES <= 1;
      document.getElementById('prop-prev').disabled = PROP_PAGE <= 1;
      document.getElementById('prop-next').disabled = PROP_PAGE >= PROP_PAGES;
    }

    // Full county from the droplet API (20/page); static sample as fallback
    // when no API is reachable (e.g. static hosting).
    function loadProperties(page) {
      const qs = new URLSearchParams({ page });
      if (PROP_Q) qs.set('q', PROP_Q);
      if (PROP_OCC) qs.set('occ', PROP_OCC);
      if (PROP_OTYPE) qs.set('otype', PROP_OTYPE);
      if (PROP_OSTATE) qs.set('ostate', PROP_OSTATE);
      fetch(`/api/properties?${qs}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => {
          PROPS = d.results; PROP_PAGE = d.page; PROP_PAGES = d.pages; PROP_TOTAL = d.total;
          PROP_GRAND = d.grand_total != null ? d.grand_total : d.total;
          renderProperties();
        })
        .catch(() => loadStaticProperties(page));
    }

    function loadStaticProperties(page) {
      (STATIC ? Promise.resolve(STATIC)
              : fetch('properties_sample.json')
                  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                  .then(d => (STATIC = d)))
        .then(all => {
          const f = all.filter(p => matchProp(p, PROP_Q, PROP_OCC, PROP_OTYPE, PROP_OSTATE));
          PROP_GRAND = all.length; PROP_TOTAL = f.length;
          PROP_PAGES = Math.max(1, Math.ceil(f.length / 20));
          PROP_PAGE = Math.min(Math.max(1, page), PROP_PAGES);
          PROPS = f.slice((PROP_PAGE - 1) * 20, PROP_PAGE * 20);
          renderProperties();
        })
        .catch(e => {
          document.getElementById('prop-error').innerHTML =
            `<p class="err">Could not load properties (${e.message}).</p>`;
        });
    }

    document.getElementById('prop-prev').addEventListener('click', () => loadProperties(PROP_PAGE - 1));
    document.getElementById('prop-next').addEventListener('click', () => loadProperties(PROP_PAGE + 1));

    const applyPropFilters = () => {
      PROP_Q = document.getElementById('prop-search').value.trim();
      PROP_OCC = document.getElementById('prop-occ').value;
      PROP_OTYPE = document.getElementById('prop-otype').value;
      PROP_OSTATE = document.getElementById('prop-ostate').value;
      loadProperties(1);
    };
    document.getElementById('prop-search').addEventListener('input', debounce(applyPropFilters, 350));
    ['prop-occ', 'prop-otype', 'prop-ostate'].forEach(id =>
      document.getElementById(id).addEventListener('change', applyPropFilters));

    /* ---- Defaults tab: same columns, plus Why (?) and Score ---- */
    let DEFAULTS = null;
    function showWhy(d, anchor) {
      // Reuse the definition popup shell for the "why flagged" list.
      showDefinition('__none__', anchor);            // creates defPopup if needed
      defPopup.innerHTML =
        `<div class="def-name">Why flagged (score ${d.default_score})</div>` +
        `<div class="def-desc"><ul style="margin:.2rem 0 0 1rem;padding:0;">` +
        (d.default_reasons || []).map(x => `<li>${esc(x.reason)} <span class="muted">(+${x.points})</span></li>`).join('') +
        `</ul></div>` +
        `<div class="def-src">v0 rule-based score, not yet a trained model</div>`;
      defPopup.hidden = false;
      const r = anchor.getBoundingClientRect();
      const maxLeft = document.documentElement.clientWidth - defPopup.offsetWidth - 10;
      defPopup.style.top = (r.bottom + window.scrollY + 6) + 'px';
      defPopup.style.left = Math.min(r.left + window.scrollX, maxLeft + window.scrollX) + 'px';
    }

    let DEF_Q = '', DEF_OCC = '', DEF_OTYPE = '', DEF_OSTATE = '', DEF_SHOWN = [];
    function renderDefaults() {
      const list = DEFAULTS.filter(p => matchProp(p, DEF_Q, DEF_OCC, DEF_OTYPE, DEF_OSTATE));
      DEF_SHOWN = list;
      const cols = [
        ['?', '_why', '', null],
        ...PROP_COLS,
      ];
      document.getElementById('defaults-empty').hidden = list.length > 0;
      document.querySelector('#def-table thead').innerHTML =
        '<tr>' + cols.map(c => c[1] === '_why'
          ? `<th class="${c[2]}">${c[0]}</th>`
          : `<th class="${c[2]} jump" data-feature="${colFeature(c[1])}">${c[0]}</th>`).join('') + '</tr>';
      document.querySelectorAll('#def-table th.jump').forEach(th =>
        th.addEventListener('click', () => showDefinition(th.dataset.feature, th)));
      document.querySelector('#def-table tbody').innerHTML = list.map((p, i) =>
        '<tr>' + cols.map(c =>
          c[1] === '_why'
            ? `<td><span class="why-btn" data-idx="${i}" title="Why is this here?">?</span></td>`
            : `<td class="${c[2]}">${c[3](p[c[1]])}</td>`).join('') + '</tr>').join('');
      document.querySelectorAll('#def-table .why-btn').forEach(el =>
        el.addEventListener('click', ev => { ev.stopPropagation(); showWhy(DEF_SHOWN[el.dataset.idx], el); }));
      const df = DEF_Q || DEF_OCC || DEF_OTYPE || DEF_OSTATE;
      document.getElementById('def-count').textContent = df
        ? `${list.length} of ${DEFAULTS.length} flagged properties`
        : `${DEFAULTS.length} properties flagged`;
    }

    function loadDefaults() {
      if (DEFAULTS) return;
      fetch('defaults.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => { DEFAULTS = d; renderDefaults(); })
        .catch(e => {
          document.getElementById('def-error').innerHTML =
            `<p class="err">Could not load defaults.json (${e.message}).</p>`;
        });
    }

    const applyDefFilters = () => {
      if (!DEFAULTS) return;
      DEF_Q = document.getElementById('def-search').value.trim();
      DEF_OCC = document.getElementById('def-occ').value;
      DEF_OTYPE = document.getElementById('def-otype').value;
      DEF_OSTATE = document.getElementById('def-ostate').value;
      renderDefaults();
    };
    document.getElementById('def-search').addEventListener('input', debounce(applyDefFilters, 200));
    ['def-occ', 'def-otype', 'def-ostate'].forEach(id =>
      document.getElementById(id).addEventListener('change', applyDefFilters));

    /* ---- Uploads tab: the data-lake catalog ---- */
    let UPLOADS = null;
    const fmtBytes = b => {
      if (b == null) return '—';
      if (b < 1024) return b + ' B';
      const u = ['KB', 'MB', 'GB', 'TB']; let i = -1, n = b;
      do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
      return n.toFixed(1) + ' ' + u[i];
    };
    const fmtStatus = s => `<span class="badge st-${esc(s || 'failed')}">${esc(s || '—')}</span>`;
    const fmtFetched = s => esc((s || '').replace('T', ' ').replace(/\+00:00$/, ''));

    let UP_Q = '', UP_SOURCE = '', UP_DATASET = '', UP_SHOWN = [];
    function renderUploads() {
      const list = UPLOADS.filter(u =>
        (!UP_SOURCE || u.source === UP_SOURCE) &&
        (!UP_DATASET || u.dataset === UP_DATASET) &&
        (!UP_Q || [u.source, u.dataset, u.filename, u.relpath, u.captured_date]
          .join(' ').toLowerCase().includes(UP_Q.toLowerCase())));
      UP_SHOWN = list;
      document.getElementById('uploads-empty').hidden = list.length > 0;
      const uf = UP_Q || UP_SOURCE || UP_DATASET;
      document.getElementById('up-count').textContent = uf
        ? `${list.length} of ${UPLOADS.length} captures`
        : `${UPLOADS.length} weekly capture${UPLOADS.length === 1 ? '' : 's'} in the lake`;
      document.querySelector('#up-table tbody').innerHTML = list.map(u => {
        const file = u.source_url
          ? `<a href="${esc(u.source_url)}" target="_blank" rel="noopener noreferrer">${esc(u.filename)}</a>`
          : esc(u.filename);
        return '<tr>' +
          `<td>${esc(u.captured_date)}</td>` +
          `<td class="muted">${linkifySource(u.source || '')}</td>` +
          `<td>${esc(u.dataset || '')}</td>` +
          `<td>${file}<div class="muted" style="font-size:.75rem;">${esc(u.relpath || '')}</div></td>` +
          `<td class="num">${u.rows == null ? '—' : u.rows.toLocaleString()}</td>` +
          `<td class="num">${fmtBytes(u.bytes)}</td>` +
          `<td>${fmtStatus(u.status)}</td>` +
          `<td class="muted">${fmtFetched(u.fetched_at)}</td>` +
          `<td><code title="${esc(u.sha256 || '')}">${esc((u.sha256 || '—').slice(0, 10))}</code></td>` +
        '</tr>';
      }).join('');
      document.querySelectorAll('#up-table tbody tr').forEach((tr, i) =>
        tr.addEventListener('click', () => showUploadPreview(UP_SHOWN[i])));
    }

    const PREVIEW = document.getElementById('preview-modal');
    let PV_U = null, PV_Q = '', PV_PAGE = 1, PV_PAGES = 1, PV_TOTAL = 0;
    const PV_LIMIT = 25;
    let pvTimer = null;
    const closePreview = () => { PREVIEW.hidden = true; };
    document.getElementById('preview-close').addEventListener('click', closePreview);
    PREVIEW.addEventListener('click', e => { if (e.target === PREVIEW) closePreview(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !PREVIEW.hidden) closePreview(); });
    document.getElementById('preview-search').addEventListener('input', e => {
      const v = e.target.value.trim();
      clearTimeout(pvTimer);
      pvTimer = setTimeout(() => { PV_Q = v; fetchPreview(1); }, 300);
    });

    function showUploadPreview(u) {
      PV_U = u; PV_Q = ''; PV_PAGE = 1;
      document.getElementById('preview-search').value = '';
      document.getElementById('preview-title').innerHTML =
        `${esc(u.source || '')} · ${esc(u.dataset || '')} <code>${esc(u.captured_date || '')}</code>`;
      document.getElementById('preview-meta').innerHTML =
        `${esc(u.relpath || '')} — ${u.rows == null ? '—' : u.rows.toLocaleString()} rows · ${fmtBytes(u.bytes)} · ${fmtStatus(u.status)}`;
      PREVIEW.hidden = false;
      fetchPreview(1);
    }

    // Windowed page list: 1 2 … p-1 p p+1 … n-1 n
    function pageList(page, pages) {
      const want = new Set([1, 2, pages - 1, pages, page - 1, page, page + 1]);
      const arr = [...want].filter(p => p >= 1 && p <= pages).sort((a, b) => a - b);
      const out = []; let prev = 0;
      for (const p of arr) { if (p - prev > 1) out.push('…'); out.push(p); prev = p; }
      return out;
    }

    function renderPreviewPager() {
      const pg = document.getElementById('preview-pager');
      if (PV_PAGES <= 1) { pg.innerHTML = ''; return; }
      let html = `<button data-pg="prev"${PV_PAGE <= 1 ? ' disabled' : ''}>←</button>`;
      for (const p of pageList(PV_PAGE, PV_PAGES))
        html += p === '…' ? '<span class="ell">…</span>'
          : `<button data-pg="${p}"${p === PV_PAGE ? ' class="active"' : ''}>${p}</button>`;
      html += `<button data-pg="next"${PV_PAGE >= PV_PAGES ? ' disabled' : ''}>→</button>`;
      pg.innerHTML = html;
      pg.querySelectorAll('button[data-pg]').forEach(b => b.addEventListener('click', () => {
        const d = b.dataset.pg;
        const t = d === 'prev' ? PV_PAGE - 1 : d === 'next' ? PV_PAGE + 1 : parseInt(d, 10);
        if (t >= 1 && t <= PV_PAGES && t !== PV_PAGE) fetchPreview(t);
      }));
    }

    function fetchPreview(page) {
      PV_PAGE = page;
      const thead = document.querySelector('#preview-table thead');
      const tbody = document.querySelector('#preview-table tbody');
      document.getElementById('preview-note').textContent = 'Loading…';
      const url = `/api/uploads/preview?relpath=${encodeURIComponent(PV_U.relpath)}` +
        `&page=${page}&limit=${PV_LIMIT}` + (PV_Q ? `&q=${encodeURIComponent(PV_Q)}` : '');
      fetch(url)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => {
          const cols = d.columns || [];
          PV_PAGES = d.pages || 1; PV_TOTAL = d.total || 0;
          thead.innerHTML = '<tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
          tbody.innerHTML = (d.rows || []).map(row =>
            '<tr>' + cols.map(c => {
              let v = row[c];
              if (v === null || v === undefined || v === '') return '<td class="muted">—</td>';
              if (typeof v === 'object') v = JSON.stringify(v);
              return `<td title="${esc(String(v))}">${esc(String(v))}</td>`;
            }).join('') + '</tr>').join('');
          document.querySelector('.modal-body').scrollTop = 0;
          const shown = (d.rows || []).length;
          const from = PV_TOTAL ? (d.start || 0) + 1 : 0;
          const to = (d.start || 0) + shown;
          document.getElementById('preview-note').textContent = PV_TOTAL
            ? `Rows ${from.toLocaleString()}–${to.toLocaleString()} of ${PV_TOTAL.toLocaleString()}` +
              (PV_Q ? ` matching “${PV_Q}”` : '') + ` · ${cols.length} columns`
            : `No rows match “${PV_Q}”`;
          renderPreviewPager();
        })
        .catch(e => {
          document.getElementById('preview-note').innerHTML =
            `<span class="err">Could not load preview (${e.message}). The preview reads the file on the server, so it needs the live API.</span>`;
          document.getElementById('preview-pager').innerHTML = '';
        });
    }

    function loadUploads() {
      if (UPLOADS) return;
      const done = d => {
        UPLOADS = d;
        fill('up-source', [...new Set(d.map(u => u.source).filter(Boolean))].sort());
        fill('up-dataset', [...new Set(d.map(u => u.dataset).filter(Boolean))].sort());
        renderUploads();
      };
      fetch('/api/uploads')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(done)
        .catch(() => fetch('uploads.json')
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(done)
          .catch(e => {
            document.getElementById('up-error').innerHTML =
              `<p class="err">Could not load uploads (${e.message}).</p>`;
          }));
    }

    const applyUpFilters = () => {
      if (!UPLOADS) return;
      UP_Q = document.getElementById('up-search').value.trim();
      UP_SOURCE = document.getElementById('up-source').value;
      UP_DATASET = document.getElementById('up-dataset').value;
      renderUploads();
    };
    document.getElementById('up-search').addEventListener('input', debounce(applyUpFilters, 200));
    ['up-source', 'up-dataset'].forEach(id =>
      document.getElementById(id).addEventListener('change', applyUpFilters));

    // Inline stroke icons (no dependencies) — brand, nav, and view headers.
    const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const ICONS = {
      brand:      SVG('<path d="M3 10.6 12 3.3l9 7.3"/><path d="M5.3 9.2V20h13.4V9.2"/><path d="M7.8 14.4h2.1l1.3-2.7 1.7 5 1-2.3h1.9"/>'),
      uploads:    SVG('<ellipse cx="12" cy="5" rx="7.5" ry="2.7"/><path d="M4.5 5v6c0 1.5 3.36 2.7 7.5 2.7s7.5-1.2 7.5-2.7V5"/><path d="M4.5 11v6c0 1.5 3.36 2.7 7.5 2.7s7.5-1.2 7.5-2.7v-6"/>'),
      features:   SVG('<path d="M3 12h3.5l2.2-6 3.3 12 2.3-6H21"/>'),
      properties: SVG('<path d="M3 10.6 12 3.3l9 7.3"/><path d="M5.3 9.2V20h13.4V9.2"/><path d="M10 20v-5h4v5"/>'),
      defaults:   SVG('<path d="M5 21.5V3"/><path d="M5 4h12.5l-2.6 3.6L17.5 11H5z"/>'),
      schedule:   SVG('<path d="M20.5 11V6a2 2 0 0 0-2-2H5.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5.2"/><path d="M3.5 9h17"/><path d="M8 3v3"/><path d="M16 3v3"/><circle cx="17.5" cy="16.7" r="3.8"/><path d="M17.5 15.1v1.8l1.2.9"/>'),
      clock:      SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 1.8"/>'),
      repeat:     SVG('<path d="M17 2.5 20.5 6 17 9.5"/><path d="M20.5 6H7A3.5 3.5 0 0 0 3.5 9.5V11"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M3.5 18H17a3.5 3.5 0 0 0 3.5-3.5V13"/>'),
      check:      SVG('<path d="M20 6.5 9.5 17 4 11.5"/>'),
      terminal:   SVG('<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7.5 9.5 10.5 12l-3 2.5"/><path d="M12.5 15h4"/>'),
      pin:        SVG('<path d="M12 21.5S19 15.6 19 10a7 7 0 1 0-14 0c0 5.6 7 11.5 7 11.5Z"/><circle cx="12" cy="10" r="2.6"/>'),
      scale:      SVG('<path d="M12 3.5v17"/><path d="M7 20.5h10"/><path d="M5.5 7.5h13"/><path d="M5.5 7.5 3 13a2.8 2.8 0 0 0 5 0L5.5 7.5Z"/><path d="M18.5 7.5 16 13a2.8 2.8 0 0 0 5 0l-2.5-5.5Z"/>'),
      landmark:   SVG('<path d="M3.5 20.5h17"/><path d="M5.5 20.5V10"/><path d="M9.5 20.5V10"/><path d="M14.5 20.5V10"/><path d="M18.5 20.5V10"/><path d="M12 3.5 20.5 8h-17L12 3.5Z"/>'),
      edit:       SVG('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>'),
    };
    const srcIcon = s => /pacer/i.test(s) ? ICONS.scale : /sos/i.test(s) ? ICONS.landmark : ICONS.pin;
    document.getElementById('brand-mark').innerHTML = ICONS.brand;
    document.querySelectorAll('.nav-ico[data-ico]').forEach(el => el.innerHTML = ICONS[el.dataset.ico] || '');

    // ---- Schedule view: editable jobs table + detail/edit modal ----
    let SCHED_JOBS = [], SCHED_UPLOADS = [];
    const DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const CAD_LABEL = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', quarterly: 'Quarterly', continuous: 'Continuous' };
    const QMONTHS = [0, 3, 6, 9];  // Jan, Apr, Jul, Oct
    const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
    const fmtNext = d => d ? d.toLocaleString(undefined,
      { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
    const fmtDate = s => { if (!s) return '—'; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
    const fmtDateTime = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); };
    const fmtTime = j => { if (j.hour == null) return '—'; const h = j.hour, m = j.minute || 0; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
    const hhmm = j => (j.hour == null) ? '04:00' : String(j.hour).padStart(2, '0') + ':' + String(j.minute || 0).padStart(2, '0');

    function nextRun(j) {  // computed in the viewer's local time (= Pacific for this user)
      if (j.continuous || j.enabled === false) return null;
      const now = new Date();
      for (let i = 0; i < 400; i++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, j.hour || 0, j.minute || 0, 0);
        if (d <= now) continue;
        if (j.cadence === 'daily') return d;
        if (j.cadence === 'weekly' && d.getDay() === j.dow) return d;
        if (j.cadence === 'monthly' && d.getDate() === j.dom) return d;
        if (j.cadence === 'quarterly' && d.getDate() === j.dom && QMONTHS.includes(d.getMonth())) return d;
      }
      return null;
    }
    function dayLabel(j) {
      if (j.continuous) return '—';
      if (j.cadence === 'daily') return 'Every day';
      if (j.cadence === 'weekly') return DOW_NAMES[j.dow] || '—';
      if (j.cadence === 'monthly') return ord(j.dom) + ' of month';
      if (j.cadence === 'quarterly') return ord(j.dom) + ' · Jan/Apr/Jul/Oct';
      return '—';
    }
    function lastCaptured(dataset) {
      const rows = SCHED_UPLOADS.filter(r => r.dataset === dataset);
      rows.sort((a, b) => (b.captured_date || '').localeCompare(a.captured_date || ''));
      return rows[0] || null;
    }

    function schedRowHtml(j) {
      const last = lastCaptured(j.dataset);
      const errored = !!(last && last.status === 'failed');
      const active = j.enabled !== false;
      const icoClass = !active ? 'inactive' : errored ? 'error' : 'active';
      const icoTitle = !active ? 'Inactive' : errored ? 'Last capture failed' : 'Active';
      const next = j.continuous ? 'always on' : (active ? fmtNext(nextRun(j)) : 'paused');
      const lastTxt = last ? (errored ? '✗ ' : '✓ ') + (last.fetched_at ? fmtDateTime(last.fetched_at) : fmtDate(last.captured_date)) : '—';
      return `<tr data-id="${esc(j.id)}" style="--cc:${j.color}" class="${active ? '' : 'off'}">
        <td class="st"><span class="sched-rico ${icoClass}" title="${icoTitle}">${ICONS.clock}</span></td>
        <td class="sname">${esc(j.name)}</td>
        <td class="cap-src">${esc(j.source)}</td>
        <td><span class="sched-pill">${esc(CAD_LABEL[j.cadence] || j.cadence)}</span></td>
        <td>${esc(dayLabel(j))}</td>
        <td class="mono2">${j.continuous ? '—' : esc(fmtTime(j))}</td>
        <td class="nowrap">${next}</td>
        <td class="nowrap">${lastTxt}</td>
        <td class="st">${j.continuous ? '' : `<button class="icon-btn" title="Edit">${ICONS.edit}</button>`}</td>
      </tr>`;
    }
    function renderSchedTable() {
      const q = (document.getElementById('sched-search').value || '').toLowerCase().trim();
      const fsrc = document.getElementById('sched-fsrc').value;
      const ffreq = document.getElementById('sched-ffreq').value;
      const jobs = SCHED_JOBS.filter(j => {
        if (fsrc && j.source !== fsrc) return false;
        if (ffreq && j.cadence !== ffreq) return false;
        if (q && !(`${j.name} ${j.source} ${j.cadence} ${j.what || ''}`.toLowerCase().includes(q))) return false;
        return true;
      });
      document.querySelector('#sched-table tbody').innerHTML = jobs.map(schedRowHtml).join('');
      document.querySelectorAll('#sched-table tbody tr').forEach(tr =>
        tr.addEventListener('click', () => openSchedModal(tr.dataset.id)));
    }
    document.getElementById('sched-search').addEventListener('input', debounce(renderSchedTable, 150));
    ['sched-fsrc', 'sched-ffreq'].forEach(id =>
      document.getElementById(id).addEventListener('change', renderSchedTable));

    async function loadSchedule() {
      const err = document.getElementById('sched-error'); err.textContent = '';
      try {
        const bust = '?t=' + Date.now();
        const [cfg, uploads] = await Promise.all([
          fetch('schedule.json' + bust).then(r => r.json()),
          fetch('uploads.json' + bust).then(r => r.ok ? r.json() : []).catch(() => []),
        ]);
        SCHED_JOBS = cfg.jobs || [];
        SCHED_UPLOADS = uploads;
        const nActive = SCHED_JOBS.filter(j => j.enabled !== false).length;
        document.getElementById('sched-summary').innerHTML =
          `<b>${SCHED_JOBS.length}</b> schedulers · <b>${nActive}</b> active — click a row to view or edit. Times are Pacific.`;
        const srcSel = document.getElementById('sched-fsrc'), cur = srcSel.value;
        const srcs = [...new Set(SCHED_JOBS.map(j => j.source))].sort();
        srcSel.innerHTML = '<option value="">All sources</option>'
          + srcs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
        srcSel.value = cur;
        renderSchedTable();
      } catch (e) {
        err.textContent = 'Could not load schedule (' + e.message + ').';
      }
    }

    // ---- Scheduler detail / edit modal ----
    const SM = document.getElementById('sched-modal');
    let SM_JOB = null;
    const ADMIN_KEY = 'dp_admin_token';
    (function fillDaySelects() {
      document.getElementById('sm-dow').innerHTML = DOW_NAMES.map((n, i) => `<option value="${i}">${n}</option>`).join('');
      document.getElementById('sm-dom').innerHTML = Array.from({ length: 28 }, (_, i) => i + 1)
        .map(d => `<option value="${d}">${ord(d)}</option>`).join('');
    })();
    function syncDayFields() {
      const cad = document.getElementById('sm-cadence').value;
      document.getElementById('sm-dow-field').hidden = cad !== 'weekly';
      document.getElementById('sm-dom-field').hidden = !(cad === 'monthly' || cad === 'quarterly');
    }
    document.getElementById('sm-cadence').addEventListener('change', syncDayFields);
    document.getElementById('sm-enabled').addEventListener('change', e =>
      document.getElementById('sm-enabled-lbl').textContent = e.target.checked ? 'Active' : 'Paused');

    function openSchedModal(i) {
      const j = SCHED_JOBS[i]; if (!j) return;
      SM_JOB = j;
      document.getElementById('sm-title').textContent = j.name;
      document.getElementById('sm-source').innerHTML = j.source_url
        ? `${esc(j.source)} · <a href="${esc(j.source_url)}" target="_blank" rel="noopener">source ↗</a>` : esc(j.source);
      document.getElementById('sm-what').textContent = j.what || '';
      document.getElementById('sm-why').textContent = j.why || '';
      document.getElementById('sm-note').hidden = true;  // no "why it's daily" note
      const cont = document.getElementById('sm-cont'), edit = document.getElementById('sm-edit'), foot = document.getElementById('sm-foot');
      if (j.continuous) {
        cont.hidden = false; cont.textContent = 'Continuous rolling refresh — always on, no fixed schedule to edit.';
        edit.hidden = true; foot.hidden = true;
      } else {
        cont.hidden = true; edit.hidden = false; foot.hidden = false;
        document.getElementById('sm-enabled').checked = j.enabled !== false;
        document.getElementById('sm-enabled-lbl').textContent = j.enabled !== false ? 'Active' : 'Paused';
        document.getElementById('sm-cadence').value = j.cadence;
        document.getElementById('sm-dow').value = (j.dow ?? 0);
        document.getElementById('sm-dom').value = (j.dom ?? 1);
        document.getElementById('sm-time').value = hhmm(j);
        syncDayFields();
        document.getElementById('sm-msg').textContent = '';
      }
      SM.hidden = false;
    }
    function closeSchedModal() { SM.hidden = true; SM_JOB = null; }
    document.getElementById('sm-close').addEventListener('click', closeSchedModal);
    SM.addEventListener('click', e => { if (e.target === SM) closeSchedModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !SM.hidden) closeSchedModal(); });

    document.getElementById('sm-save').addEventListener('click', async () => {
      if (!SM_JOB) return;
      let token = localStorage.getItem(ADMIN_KEY);
      if (!token) {
        token = prompt('Admin password to change the schedule:');
        if (!token) return;
        localStorage.setItem(ADMIN_KEY, token);
      }
      const cad = document.getElementById('sm-cadence').value;
      const [hh, mm] = (document.getElementById('sm-time').value || '04:00').split(':').map(Number);
      const fields = {
        enabled: document.getElementById('sm-enabled').checked,
        cadence: cad, hour: hh, minute: mm,
        dow: cad === 'weekly' ? +document.getElementById('sm-dow').value : null,
        dom: (cad === 'monthly' || cad === 'quarterly') ? +document.getElementById('sm-dom').value : null,
      };
      const msg = document.getElementById('sm-msg');
      msg.textContent = 'Saving…'; msg.className = '';
      try {
        const res = await fetch('/api/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
          body: JSON.stringify({ id: SM_JOB.id, fields }),
        });
        if (res.status === 401) { localStorage.removeItem(ADMIN_KEY); msg.textContent = 'Wrong admin password — try again.'; msg.className = 'bad'; return; }
        if (!res.ok) { msg.textContent = 'Save failed (' + res.status + ').'; msg.className = 'bad'; return; }
        Object.assign(SM_JOB, fields);
        msg.textContent = 'Saved ✓'; msg.className = 'ok2';
        await loadSchedule();
        setTimeout(closeSchedModal, 650);
      } catch (e2) {
        msg.textContent = 'Save failed: ' + e2.message; msg.className = 'bad';
      }
    });

    // Per-view title, subtitle, and accent color shown in the main header.
    const VIEW_META = {
      schedule:   ['Download Schedule', 'What the pipeline captures automatically, and when.', '#34d399'],
      uploads:    ['Data Lake — Uploads', 'Every raw capture landed in the lake, with provenance.', '#58a6ff'],
      features:   ['Feature List', 'Signals the model uses and where each one comes from.', '#a78bfa'],
      properties: ['Properties', 'All Multnomah County parcels with owner and distress signals.', '#2dd4bf'],
      defaults:   ['Flagged Defaults', 'Properties showing pre-foreclosure distress.', '#fb923c'],
    };
    function selectTab(tab) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('tab-schedule').hidden = tab !== 'schedule';
      document.getElementById('tab-features').hidden = tab !== 'features';
      document.getElementById('tab-properties').hidden = tab !== 'properties';
      document.getElementById('tab-defaults').hidden = tab !== 'defaults';
      document.getElementById('tab-uploads').hidden = tab !== 'uploads';
      const [title, sub, color] = VIEW_META[tab] || ['', '', 'var(--accent)'];
      document.getElementById('view-title').textContent = title;
      document.getElementById('view-sub').textContent = sub;
      document.getElementById('view-ico').innerHTML = ICONS[tab] || '';
      document.getElementById('view-head').style.setProperty('--va', color);
      if (tab === 'schedule') loadSchedule();
      if (tab === 'properties' && !PROPS) loadProperties(1);
      if (tab === 'defaults') loadDefaults();
      if (tab === 'uploads') loadUploads();
      try { history.replaceState(null, '', '#' + tab); } catch (e) { /* ignore */ }
    }

    document.querySelectorAll('.nav-item').forEach(btn =>
      btn.addEventListener('click', () => selectTab(btn.dataset.tab)));
    // Keep the current view across a page refresh via the URL hash.
    const _hash = (location.hash || '').replace('#', '');
    selectTab(VIEW_META[_hash] ? _hash : 'features');
  </script>
</body>
</html>

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt (for compile check)
        run: pip install "dbt-core>=1.10,<1.13" "dbt-duckdb>=1.10,<1.13" "duckdb>=1.4"

      - name: dbt parse (models compile)
        working-directory: warehouse
        run: dbt parse --profiles-dir .

      - name: Python syntax check
        run: python -m compileall -q pipeline orchestration tools

name: 'default_predictor'
version: '1.0.0'
config-version: 2
profile: 'default_predictor'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Lake location, relative to this project dir. Override with:
#   dbt run --vars '{lake_path: /abs/path/to/data/lake}'
vars:
  # Local folder by default; set DBT_LAKE_PATH=s3://<bucket> to read the lake
  # from DigitalOcean Spaces (also configure httpfs + an S3 secret in profiles).
  lake_path: "{{ env_var('DBT_LAKE_PATH', '../data/lake') }}"

models:
  default_predictor:
    staging:
      +materialized: view     # thin views straight over the raw lake files
    core:
      +materialized: table    # conformed entities + events
    mart:
      +materialized: table    # purpose-built, flattened outputs
